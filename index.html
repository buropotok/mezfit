<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <title>Mezfit</title>
    <style>
      #mezfit-boot-diagnostics {
        position: fixed;
        inset: 16px;
        z-index: 2147483647;
        overflow: auto;
        box-sizing: border-box;
        padding: 16px;
        border-radius: 12px;
        background: #101114;
        color: #f5f5f5;
        font-family: var(--ui-font-family, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        font-size: var(--ui-font-size-body, 15px);
        line-height: var(--ui-line-height-body, 20px);
        font-weight: var(--ui-font-weight-regular, 400);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <script>
      (function () {
        var startedAt = Date.now();
        var sessionId = 'boot-' + startedAt.toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        var lastStage = 'html-start';
        var finished = false;
        var panel = null;

        function bounded(value, maxLength) {
          return typeof value === 'string' ? value.slice(0, maxLength) : null;
        }

        function telegramSnapshot() {
          var webApp = window.Telegram && window.Telegram.WebApp;
          return {
            available: Boolean(webApp),
            version: webApp ? bounded(webApp.version, 32) : null,
            platform: webApp ? bounded(webApp.platform, 32) : null
          };
        }

        function sanitizeDetails(details) {
          if (!details || typeof details !== 'object') return undefined;
          var safe = {};
          if (typeof details.timeoutMs === 'number') safe.timeoutMs = details.timeoutMs;
          if (typeof details.httpStatus === 'number') safe.httpStatus = details.httpStatus;
          if (typeof details.reason === 'string') safe.reason = details.reason.slice(0, 64);
          if (typeof details.errorName === 'string') safe.errorName = details.errorName.slice(0, 64);
          return safe;
        }

        function mark(stage) {
          if (typeof stage === 'string') lastStage = stage.slice(0, 64);
        }

        function report(stage, details) {
          try {
            var request = new XMLHttpRequest();
            request.open('POST', '/api/diagnostics/boot', true);
            request.setRequestHeader('content-type', 'application/json');
            request.timeout = 4000;
            request.send(JSON.stringify({
              sessionId: sessionId,
              stage: stage,
              lastStage: lastStage,
              elapsedMs: Date.now() - startedAt,
              path: window.location.pathname.slice(0, 120),
              userAgent: bounded(navigator.userAgent, 400) || '',
              online: typeof navigator.onLine === 'boolean' ? navigator.onLine : null,
              telegram: telegramSnapshot(),
              details: sanitizeDetails(details)
            }));
          } catch (_) {
            // Diagnostics must never become a startup dependency.
          }
        }

        function renderPanel(observedStage, details) {
          if (finished) return;
          var webApp = window.Telegram && window.Telegram.WebApp;
          if (webApp && typeof webApp.ready === 'function') {
            try {
              webApp.ready();
            } catch (_) {
              // The diagnostic panel still works in a normal browser surface.
            }
          }

          if (!panel) {
            panel = document.createElement('div');
            panel.id = 'mezfit-boot-diagnostics';
            panel.setAttribute('role', 'alert');
            document.documentElement.appendChild(panel);
          }

          var telegram = telegramSnapshot();
          var detailText = details && details.errorName ? '\nОшибка: ' + details.errorName : '';
          panel.textContent =
            'Mezfit: диагностика запуска\n\n' +
            'Последний этап: ' + observedStage + '\n' +
            'Прошло: ' + (Date.now() - startedAt) + ' мс\n' +
            'Telegram SDK: ' + (telegram.available ? 'да' : 'нет') + '\n' +
            'Telegram platform: ' + (telegram.platform || 'не определена') + '\n' +
            'Telegram version: ' + (telegram.version || 'не определена') + '\n' +
            'Online: ' + (typeof navigator.onLine === 'boolean' ? String(navigator.onLine) : 'неизвестно') +
            detailText +
            '\n\nСделайте скриншот этого экрана и приложите его к сообщению об ошибке.';
        }

        function fail(stage, details) {
          mark(stage);
          report(stage, details);
          renderPanel(stage, details);
        }

        function finish() {
          if (finished) return;
          finished = true;
          lastStage = 'app-ready';
          if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
          panel = null;
        }

        window.__MEZFIT_BOOT__ = {
          mark: mark,
          report: report,
          finish: finish,
          fail: fail
        };

        mark('html-start');
        window.addEventListener('error', function (event) {
          var errorName = event && event.error && event.error.name ? String(event.error.name) : 'Error';
          fail('window-error', { errorName: errorName });
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var errorName = reason && reason.name ? String(reason.name) : 'UnhandledRejection';
          fail('unhandled-rejection', { errorName: errorName });
        });
        window.setTimeout(function () {
          if (finished) return;
          var observedStage = lastStage;
          report('startup-stalled', { reason: observedStage });
          renderPanel(observedStage);
        }, 8000);
      }());
    </script>
    <script>window.__MEZFIT_BOOT__.mark('telegram-sdk-start');</script>
    <script
      src="https://telegram.org/js/telegram-web-app.js"
      onload="window.__MEZFIT_BOOT__.mark('telegram-sdk-loaded')"
      onerror="window.__MEZFIT_BOOT__.fail('telegram-sdk-error', { reason: 'load-error' })"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
