<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mezfit FAB — liquid press geometry prototype</title>
<style>
:root{
  --bg:#151e27;
  --fg:#f5f7fa;
  --muted:#9baaba;
  --accent:#2f9bff;
  --surface:#1d2733;
  --border:#2a3948;
  --ui-font-family:"Zen Maru Gothic",system-ui,sans-serif;
  --ui-font-size-body:15px;
  --ui-line-height-body:20px;
  --ui-font-size-caption:12px;
  --ui-line-height-caption:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui-font-family)}
body{min-height:100dvh;display:grid;place-items:center;overflow:hidden;touch-action:none}
.stage{position:relative;width:min(92vw,560px);height:min(78dvh,560px);min-height:360px;border:1px solid var(--border);border-radius:28px;overflow:hidden;background:
  radial-gradient(circle at 50% 50%,rgba(47,155,255,.08),transparent 42%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
  var(--surface);
  background-size:auto,24px 24px,24px 24px,auto;
}
.stage::before,.stage::after{content:"";position:absolute;left:50%;top:50%;pointer-events:none;opacity:.26}
.stage::before{width:1px;height:100%;background:var(--muted);transform:translate(-.5px,-50%)}
.stage::after{width:100%;height:1px;background:var(--muted);transform:translate(-50%,-.5px)}
.readout{position:absolute;left:16px;top:14px;z-index:3;display:grid;gap:2px;pointer-events:none}
.readout__title{font-size:var(--ui-font-size-body);line-height:var(--ui-line-height-body);font-weight:500}
.readout__note{color:var(--muted);font-size:var(--ui-font-size-caption);line-height:var(--ui-line-height-caption);font-weight:300}
.fab-anchor{position:absolute;left:50%;top:50%;width:56px;height:56px;transform:translate(-50%,-50%);z-index:2}
.fab-hitbox{position:absolute;inset:-18px;border:0;padding:0;background:transparent;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.fab-hitbox:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:999px}
.fab-shape{position:absolute;inset:0;border-radius:50%;background:var(--accent);box-shadow:0 12px 28px rgba(0,0,0,.34);transform-origin:50% 50%;will-change:transform;pointer-events:none}
.fab-shape::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);pointer-events:none}
.fab-plus{position:absolute;left:50%;top:50%;z-index:2;width:26px;height:26px;transform:translate(-50%,-50%) scale(var(--icon-scale,1));will-change:transform;pointer-events:none}
.fab-plus::before,.fab-plus::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:2px;border-radius:2px;background:white;transform:translate(-50%,-50%)}
.fab-plus::after{transform:translate(-50%,-50%) rotate(90deg)}
.guide{position:absolute;left:50%;top:50%;width:112px;height:112px;border:1px dashed rgba(245,247,250,.22);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.guide::after{content:"2×";position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:var(--ui-font-size-caption);line-height:var(--ui-line-height-caption)}
@media(prefers-reduced-motion:reduce){.fab-shape{will-change:auto}}
</style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="readout" aria-hidden="true">
      <div class="readout__title">FAB · liquid press</div>
      <div class="readout__note">Hold · move slightly · release</div>
    </div>
    <div class="guide" aria-hidden="true"></div>
    <div class="fab-anchor" id="anchor">
      <div class="fab-shape" id="shape" aria-hidden="true"></div>
      <span class="fab-plus" id="plus" aria-hidden="true"></span>
      <button class="fab-hitbox" id="hitbox" type="button" aria-label="Добавить"></button>
    </div>
  </main>
<script>
(() => {
  const shape = document.getElementById('shape');
  const hitbox = document.getElementById('hitbox');
  const plus = document.getElementById('plus');
  const anchor = document.getElementById('anchor');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const scale = { value: 1, velocity: 0, target: 1 };
  const deformation = { value: 0, velocity: 0, target: 0 };
  let pressed = false;
  let pointerId = null;
  let axisAngle = -Math.PI / 4;
  let lastPointer = null;
  let pointerVelocity = { x: 0, y: 0 };
  let raf = 0;
  let lastTime = 0;

  const SCALE_STIFFNESS = 340;
  const SCALE_DAMPING = 20;
  const SHAPE_STIFFNESS = 420;
  const SHAPE_DAMPING = 28;
  const MAX_STRETCH = 0.18;

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function springStep(spring, dt, stiffness, damping) {
    const acceleration = stiffness * (spring.target - spring.value) - damping * spring.velocity;
    spring.velocity += acceleration * dt;
    spring.value += spring.velocity * dt;
  }

  function pointerAngle(event) {
    const rect = anchor.getBoundingClientRect();
    const dx = event.clientX - (rect.left + rect.width / 2);
    const dy = event.clientY - (rect.top + rect.height / 2);
    if (Math.hypot(dx, dy) > 2) axisAngle = Math.atan2(dy, dx);
  }

  function updatePointerVelocity(event) {
    const now = performance.now();
    if (lastPointer) {
      const dt = Math.max(8, now - lastPointer.time) / 1000;
      pointerVelocity.x = (event.clientX - lastPointer.x) / dt;
      pointerVelocity.y = (event.clientY - lastPointer.y) / dt;
      if (Math.hypot(pointerVelocity.x, pointerVelocity.y) > 20) {
        axisAngle = Math.atan2(pointerVelocity.y, pointerVelocity.x);
      }
    }
    lastPointer = { x: event.clientX, y: event.clientY, time: now };
  }

  function render() {
    const pointerSpeed = Math.hypot(pointerVelocity.x, pointerVelocity.y);
    const velocityStretch = scale.velocity * 0.018;
    const dragStretch = pressed ? clamp(pointerSpeed / 4200, 0, 0.08) : 0;
    deformation.target = clamp(velocityStretch + dragStretch, -MAX_STRETCH, MAX_STRETCH);

    const sx = scale.value * (1 + deformation.value);
    const sy = scale.value * (1 - deformation.value * 0.62);
    shape.style.transform = `rotate(${axisAngle}rad) scale(${sx}, ${sy})`;

    // Keep the glyph upright while it follows the FAB's overall 1× → 2× growth.
    plus.style.setProperty('--icon-scale', scale.value.toFixed(4));
  }

  function tick(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min(0.032, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    springStep(scale, dt, SCALE_STIFFNESS, SCALE_DAMPING);
    springStep(deformation, dt, SHAPE_STIFFNESS, SHAPE_DAMPING);
    pointerVelocity.x *= Math.pow(0.02, dt);
    pointerVelocity.y *= Math.pow(0.02, dt);
    render();

    const moving = Math.abs(scale.target - scale.value) > 0.0005 || Math.abs(scale.velocity) > 0.002 ||
      Math.abs(deformation.value) > 0.0005 || Math.abs(deformation.velocity) > 0.002 || pressed;
    if (moving) raf = requestAnimationFrame(tick);
    else { raf = 0; lastTime = 0; render(); }
  }

  function ensureFrame() {
    if (!raf && !reduceMotion) raf = requestAnimationFrame(tick);
  }

  function press(event) {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    pressed = true;
    pointerId = event.pointerId;
    hitbox.setPointerCapture?.(event.pointerId);
    pointerAngle(event);
    updatePointerVelocity(event);
    scale.target = 2;
    if (reduceMotion) { scale.value = 2; scale.velocity = 0; deformation.value = 0; render(); }
    else ensureFrame();
  }

  function move(event) {
    if (!pressed || event.pointerId !== pointerId) return;
    updatePointerVelocity(event);
    ensureFrame();
  }

  function release(event) {
    if (!pressed || (event && event.pointerId !== pointerId)) return;
    pressed = false;
    if (event) {
      updatePointerVelocity(event);
      hitbox.releasePointerCapture?.(event.pointerId);
    }
    pointerId = null;
    lastPointer = null;
    scale.target = 1;
    if (reduceMotion) { scale.value = 1; scale.velocity = 0; deformation.value = 0; render(); }
    else ensureFrame();
  }

  hitbox.addEventListener('pointerdown', press);
  hitbox.addEventListener('pointermove', move);
  hitbox.addEventListener('pointerup', release);
  hitbox.addEventListener('pointercancel', release);
  hitbox.addEventListener('lostpointercapture', () => release());
  window.addEventListener('blur', () => release());

  render();
})();
</script>
</body>
</html>
