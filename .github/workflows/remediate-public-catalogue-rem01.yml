name: REM-01 - six critical public exercise corrections

# No automatic publication on push/PR/merge. Explicit owner dispatch on main only.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only preview or protected REM-01 publication'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish
      confirmation:
        description: 'Required only for publish: APPLY_REM_01_SIX_APPROVED'
        type: string
        required: false

permissions:
  contents: read

# Share the public catalogue mutation lock with initial/tracking publishers.
concurrency:
  group: dexie-public-catalogue-publishing
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.operation == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source from checked-out GitHub audit files
        run: test -s audit/visual/input/manifest.json
      - name: Read-only comparison with all live public records
        env:
          DEXIE_CLOUD_KEY_JSON: ${{ secrets.DEXIE_CLOUD_KEY_JSON }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode preview --source-dir audit/visual/input
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/rem-01"

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.operation == 'publish' &&
      inputs.confirmation == 'APPLY_REM_01_SIX_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # REQUIRED existing environment: main-only and mandatory human reviewer.
    environment:
      name: dexie-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source from checked-out GitHub audit files
        run: |
          set -euo pipefail
          test -s audit/visual/input/manifest.json
          install -d -m 700 "$RUNNER_TEMP/rem-01"
      - name: Read-only preflight; must report editorApproved true
        env:
          DEXIE_CLOUD_KEY_JSON: ${{ secrets.DEXIE_CLOUD_KEY_JSON }}
        run: |
          set -euo pipefail
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode preview --source-dir audit/visual/input \
            | tee "$RUNNER_TEMP/rem-01/preview.json"
          node -e "const r=require(process.argv[1]); if (!r.publishAllowed || r.totalIds !== 6) process.exit(1)" \
            "$RUNNER_TEMP/rem-01/preview.json"
      - name: Export entire public scope to private-only backup
        env:
          DEXIE_CLOUD_WRITE_KEY: ${{ secrets.DEXIE_CLOUD_WRITE_KEY }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode backup --source-dir audit/visual/input \
            --out "$RUNNER_TEMP/rem-01/public-before.json"
      - name: Upload private public-scope snapshot to GitHub Actions Artifact
        id: backup
        uses: actions/upload-artifact@v4
        with:
          name: rem-01-public-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rem-01/public-before.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Confirm artifact persisted before any write
        id: verified-backup
        env:
          ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/rem-01/public-before.json"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          echo "saved=yes" >> "$GITHUB_OUTPUT"
      - name: Correct exactly six definitions; read back 1324 plus taxonomy; mark version last
        if: steps.verified-backup.outputs.saved == 'yes'
        env:
          DEXIE_CLOUD_WRITE_KEY: ${{ secrets.DEXIE_CLOUD_WRITE_KEY }}
          DEXIE_GITHUB_ARTIFACT_BACKUP_READY: ${{ steps.verified-backup.outputs.saved }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode publish --source-dir audit/visual/input \
            --backup-file "$RUNNER_TEMP/rem-01/public-before.json"
      - name: Remove preview and local backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/rem-01"
