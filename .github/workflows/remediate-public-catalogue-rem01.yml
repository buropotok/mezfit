name: REM-01 - six critical public exercise corrections

# No automatic publication on push/PR/merge. Explicit owner dispatch on main only.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only preview or protected REM-01 publication'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish
      confirmation:
        description: 'Required only for publish: APPLY_REM_01_SIX_APPROVED'
        type: string
        required: false

permissions:
  contents: read

# Share the public catalogue mutation lock with initial/tracking publishers.
concurrency:
  group: dexie-public-catalogue-publishing
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.operation == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch exact immutable v2.0 source from private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rem-01"
          npx wrangler r2 object get \
            mezfit/exercise-catalogue/source/2.0.0/sha256-5ce3e6b15117e115a1e10ac31573eb85eea6bf284a72971e5ca1ee02572aa40c.json \
            --file "$RUNNER_TEMP/rem-01/source.json" --remote
      - name: Read-only comparison with all live public records
        env:
          DEXIE_CLOUD_KEY_JSON: ${{ secrets.DEXIE_CLOUD_KEY_JSON }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode preview --source "$RUNNER_TEMP/rem-01/source.json"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP/rem-01"

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.operation == 'publish' &&
      inputs.confirmation == 'APPLY_REM_01_SIX_APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # REQUIRED existing environment: main-only and mandatory human reviewer.
    environment:
      name: dexie-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch immutable catalogue source from private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rem-01"
          npx wrangler r2 object get \
            mezfit/exercise-catalogue/source/2.0.0/sha256-5ce3e6b15117e115a1e10ac31573eb85eea6bf284a72971e5ca1ee02572aa40c.json \
            --file "$RUNNER_TEMP/rem-01/source.json" --remote
      - name: Read-only preflight; must report editorApproved true
        env:
          DEXIE_CLOUD_KEY_JSON: ${{ secrets.DEXIE_CLOUD_KEY_JSON }}
        run: |
          set -euo pipefail
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode preview --source "$RUNNER_TEMP/rem-01/source.json" \
            | tee "$RUNNER_TEMP/rem-01/preview.json"
          node -e "const r=require(process.argv[1]); if (!r.publishAllowed || r.totalIds !== 6) process.exit(1)" \
            "$RUNNER_TEMP/rem-01/preview.json"
      - name: Export entire public scope to private-only backup
        env:
          DEXIE_CLOUD_WRITE_KEY: ${{ secrets.DEXIE_CLOUD_WRITE_KEY }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode backup --source "$RUNNER_TEMP/rem-01/source.json" \
            --out "$RUNNER_TEMP/rem-01/public-before.json"
      - name: Persist private R2 backup before any changes
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            "mezfit/exercise-catalogue/backups/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/before-rem-01.json" \
            --file "$RUNNER_TEMP/rem-01/public-before.json" --remote
          echo "saved=yes" >> "$GITHUB_OUTPUT"
      - name: Correct exactly six definitions; read back 1324 plus taxonomy; mark version last
        if: steps.backup.outputs.saved == 'yes'
        env:
          DEXIE_CLOUD_WRITE_KEY: ${{ secrets.DEXIE_CLOUD_WRITE_KEY }}
          DEXIE_PRIVATE_R2_BACKUP_READY: ${{ steps.backup.outputs.saved }}
        run: |
          node tools/exercises/remediate-public-catalogue.mjs \
            --mode publish --source "$RUNNER_TEMP/rem-01/source.json"
      - name: Remove source, preview and backup
        if: always()
        run: rm -rf "$RUNNER_TEMP/rem-01"
