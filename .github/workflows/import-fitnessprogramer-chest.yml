name: Import FitnessProgramer Chest exercise JSON

on:
  push:
    branches: [main]
    paths:
      - tools/import_fitnessprogramer_chest.py
      - .github/workflows/import-fitnessprogramer-chest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-fitnessprogramer-chest-main
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && github.repository == 'buropotok/mezfit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parsing dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Import and validate full category
        run: python tools/import_fitnessprogramer_chest.py
      - name: Commit JSON into main directly
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exercises/chest/
          if ! git diff --cached --quiet; then
            git commit -m 'data: import FitnessProgramer Chest exercises'
            git push origin HEAD:refs/heads/data/chest-bullet-markers-20261027
          fi
