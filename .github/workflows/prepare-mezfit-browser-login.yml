name: Prepare MezFit Browser Telegram Login

on:
  workflow_dispatch:
    inputs:
      action:
        description: Manage browser login, JWKS mirror, or the browser Dexie token route
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - activate
          - upgrade
          - popup
          - popup-mirror
          - popup-rollback
          - dexie-tokens
          - dexie-tokens-rollback
          - login-url
          - login-url-rollback
      mode:
        description: Preview is read-only; Apply requires exact confirmation
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
      confirm:
        description: For Apply, enter the confirmation matching the selected action
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mezfit-yandex-web-gateway
  cancel-in-progress: false

jobs:
  browser-login:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate explicitly approved phase and deployment identity
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            prepare) expected=PREPARE_MEZFIT_BROWSER_LOGIN ;;
            activate) expected=ACTIVATE_MEZFIT_BROWSER_LOGIN ;;
            upgrade) expected=UPGRADE_MEZFIT_BROWSER_LOGIN_DIAGNOSTICS ;;
            popup) expected=ENABLE_MEZFIT_BROWSER_LOGIN_POPUP ;;
            popup-mirror) expected=ENABLE_MEZFIT_BROWSER_JWKS_MIRROR ;;
            popup-rollback) expected=ROLLBACK_MEZFIT_BROWSER_LOGIN_POPUP ;;
            dexie-tokens) expected=ENABLE_MEZFIT_BROWSER_DEXIE_TOKENS ;;
            dexie-tokens-rollback) expected=ROLLBACK_MEZFIT_BROWSER_DEXIE_TOKENS ;;
            login-url) expected=ENABLE_MEZFIT_TELEGRAM_LOGIN_URL ;;
            login-url-rollback) expected=ROLLBACK_MEZFIT_TELEGRAM_LOGIN_URL ;;
            *) echo "Invalid action"; exit 1 ;;
          esac
          [[ "$MODE" == preview || "$MODE" == apply ]] || { echo "Invalid mode"; exit 1; }
          if [[ "$MODE" == apply ]]; then
            [[ "$CONFIRM" == "$expected" ]] || { echo "Wrong action confirmation"; exit 1; }
          fi
          for key in YC_DEPLOY_SA_ID YC_FOLDER_ID; do
            [[ "${!key}" =~ ^[a-z0-9]+$ ]] || { echo "Missing or invalid $key"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Acquire short-lived Yandex IAM token through existing GitHub OIDC
        id: yc_iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}

      - name: Preview or apply browser-login server and gateway routes
        env:
          ACTION: ${{ inputs.action }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_IAM_TOKEN: ${{ steps.yc_iam.outputs.token }}
          # Only the owner-approved Prepare Apply receives the Telegram secret.
          # Never echo it, write to GITHUB_OUTPUT, or pass it as a CLI arg.
          TELEGRAM_LOGIN_CLIENT_ID: ${{ vars.TELEGRAM_LOGIN_CLIENT_ID }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ inputs.action == 'prepare' && inputs.mode == 'apply' && secrets.TELEGRAM_LOGIN_CLIENT_SECRET || '' }}
          DEXIE_CLOUD_CLIENT_ID: ${{ inputs.action == 'dexie-tokens' && inputs.mode == 'apply' && secrets.DEXIE_CLOUD_CLIENT_ID || '' }}
          DEXIE_CLOUD_CLIENT_SECRET: ${{ inputs.action == 'dexie-tokens' && inputs.mode == 'apply' && secrets.DEXIE_CLOUD_CLIENT_SECRET || '' }}
          TELEGRAM_BOT_TOKEN: ${{ inputs.action == 'login-url' && inputs.mode == 'apply' && secrets.TELEGRAM_BOT_TOKEN || '' }}
        run: python3 tools/yandex-infrastructure/deploy_browser_auth.py
