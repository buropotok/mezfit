name: One-time apply GIF-verified exercise metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-exercise-gif-frames.yml

permissions:
  contents: write

jobs:
  prepare-reviewed-commit:
    if: github.repository == 'buropotok/mezfit'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed fields and verify original source integrity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path(".")
          changes = {
              "Wheel Run": ("Бег на месте с высоким подниманием коленей", "time"),
              "Vibration Plate": ("Стойка на виброплатформе", "time"),
              "Backhand Raise": ("Подъём прямых рук назад стоя", "weight_reps"),
              "Hawaiian Squat": ("Гавайское приседание на одной ноге", "weight_reps"),
              "Squat mobility Complex": ("Переход из глубокого приседа в наклон вперёд", "time_reps"),
              "Ab Roller Crunch": ("Скручивания с опорной рамой Ab Roller", "weight_reps"),
          }
          paths = [
              "cardio/wheel-run.json", "cardio/vibration-plate.json",
              "shoulders/backhand-raise.json", "leg/hawaiian-squat.json",
              "hip/squat-mobility-complex.json", "leg/squat-mobility-complex.json",
              "abs/ab-roller-crunch.json",
          ]
          reviewed = {}
          modified = []
          for rel in paths:
              work = root / "assets/work" / rel
              original = json.loads((root / "assets/exercises" / rel).read_text(encoding="utf-8"))
              current = json.loads(work.read_text(encoding="utf-8"))
              assert set(current) == set(original) | {"name_ru", "tracking_type"}, rel
              assert all(current[k] == v and type(current[k]) is type(v) for k,v in original.items()), rel
              en = original["name"]
              ru, tracking = changes[en]
              reviewed[rel] = {
                  "previous": {"name_ru": current["name_ru"], "tracking_type": current["tracking_type"]},
                  "corrected": {"name_ru": ru, "tracking_type": tracking},
              }
              current["name_ru"], current["tracking_type"] = ru, tracking
              assert all(current[k] == v for k,v in original.items()), rel
              work.write_text(json.dumps(current, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
              modified.append(rel)
          editorial = {
              "curated-cardio.json": ["Wheel Run", "Vibration Plate"],
              "curated-shoulders.json": ["Backhand Raise"],
              "curated-leg.json": ["Hawaiian Squat"],
              "curated-hip.json": ["Squat mobility Complex"],
              "curated-abs.json": ["Ab Roller Crunch"],
          }
          for filename, keys in editorial.items():
              path = root / "tools/exercise-work" / filename
              mapping = json.loads(path.read_text(encoding="utf-8"))
              for key in keys:
                  ru, tracking = changes[key]
                  mapping[key] = {"name_ru": ru, "tracking_type": tracking}
              path.write_text(json.dumps(mapping, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          observations = [
              ("cardio/wheel-run.json", "36 кадров, 7,5 с: бег на месте с циклическим высоким подъёмом коленей; колеса и перемещения по дистанции нет.", "corrected"),
              ("cardio/walk-wave-machine.json", "12 кадров: ходьба на волновом кардиотренажёре; показания консоли в GIF не читаются.", "confirmed_metric_uncertain"),
              ("cardio/vibration-plate.json", "12 кадров: статическое положение стоя на виброплатформе с опорой на поручни.", "corrected"),
              ("shoulders/backhand-raise.json", "12 кадров: подъём обеих прямых рук назад, корпус слегка наклонён; отягощений нет.", "corrected"),
              ("shoulders/lever-reverse-shoulder-press.json", "12 кадров: жим вверх сидя в рычажном тренажёре; точный хват на анимации различим недостаточно.", "confirmed"),
              ("leg/hawaiian-squat.json", "12 кадров: приседание на одной опорной ноге, свободная нога согнута и уложена поверх опорной.", "corrected"),
              ("hip/squat-mobility-complex.json", "12 кадров: повторяемый переход из глубокого приседа с захватом стоп в наклон на выпрямленных ногах.", "corrected"),
              ("cardio/hook-kick.json", "18 кадров: дуговой удар ногой по подвесному мешку с возвратом в боевую стойку.", "confirmed"),
              ("abs/ab-roller-crunch.json", "12 кадров: скручивания лёжа с опорной дугообразной рамой Ab Roller, без выкатывания ролика.", "corrected"),
              ("full-body/plate-push.json", "16 кадров: продвижение весового диска по полу руками в низком положении тела; текущая схема не даёт учесть одновременно массу и дистанцию.", "confirmed_schema_limitation"),
              ("back/rope-climb.json", "12 кадров: подъём по канату руками без опоры на ноги; один подъём можно учитывать как повторение.", "confirmed"),
              ("abs/teaser-pilates.json", "12 кадров: повторяемый подъём и опускание в V-положение, не только статическое удержание.", "confirmed"),
              ("cardio/stationary-bike-run.json", "12 кадров: педалирование на вертикальном велотренажёре; конкретные числовые показатели дисплея не читаются.", "confirmed_metric_uncertain"),
          ]
          cases = []
          for rel, observation, state in observations:
              path = root / "assets/work" / rel
              work = json.loads(path.read_text(encoding="utf-8"))
              item = {"path": rel, "gif_url": work["gif_url"], "visual_evidence": observation, "status": state, "name_ru": work["name_ru"], "tracking_type": work["tracking_type"]}
              if rel in reviewed:
                  item["before"] = reviewed[rel]["previous"]
              cases.append(item)
          all_work = sorted((root / "assets/work").glob("*/*.json"))
          all_src = sorted((root / "assets/exercises").glob("*/*.json"))
          all_src = [p for p in all_src if p.name != "_manifest.json"]
          assert len(all_work) == len(all_src) == 1673
          assert {p.relative_to(root / "assets/work") for p in all_work} == {p.relative_to(root / "assets/exercises") for p in all_src}
          types = Counter()
          for work_path in all_work:
              rel = work_path.relative_to(root / "assets/work")
              w = json.loads(work_path.read_text(encoding="utf-8"))
              o = json.loads((root / "assets/exercises" / rel).read_text(encoding="utf-8"))
              assert set(w) == set(o) | {"name_ru", "tracking_type"}, rel
              assert all(w[k] == v and type(w[k]) is type(v) for k,v in o.items()), rel
              types[w["tracking_type"]] += 1
          report = {
              "source": "Original fitnessprogramer.com GIF URLs from assets/exercises",
              "method": "Downloaded original animated GIFs; visually inspected 8 uniformly sampled frames per GIF across each full cycle",
              "reviewed_cases": len(cases),
              "corrected_unique_exercises": len(changes),
              "corrected_work_json_files": len(modified),
              "tracking_changes_by_distinct_exercise": ["Wheel Run", "Squat mobility Complex"],
              "source_json_files_modified": 0,
              "all_original_fields_identical": True,
              "catalogue_count": len(all_work),
              "tracking_type_counts_after_review": dict(sorted(types.items())),
              "limitations": [
                  "GIF cannot establish which metrics an electronic cardio machine reports.",
                  "Available tracking types cannot record plate load and pushed distance together.",
                  "The prior work-generation-report.json describes the initial generation before this GIF review."
              ],
              "cases": cases
          }
          out = root / "tools/exercise-work/gif-review-report.json"
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print("REVIEWED",len(cases),"EXERCISES_CHANGED",len(changes),"WORK_FILES_CHANGED",len(modified))
          print("TRACKING_COUNTS",dict(sorted(types.items())))
          PY
          git diff --check
          git diff --exit-code -- assets/exercises/
      - name: Publish exactly one scoped correction commit to review branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gif-reviewed-corrections-20261028
          git add assets/work/ tools/exercise-work/curated-*.json tools/exercise-work/gif-review-report.json
          git rm .github/workflows/one-time-exercise-gif-frames.yml
          git commit -m 'data: correct exercise metadata after GIF frame review'
          git push origin HEAD:refs/heads/gif-reviewed-corrections-20261028
