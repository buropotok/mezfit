name: Publish Base 2 media to Yandex and R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-base2-media-v1
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned release source and install preview encoder
        run: |
          node tools/exercises/fitnessprogramer-operator.mjs validate-source
          python -m pip install --only-binary=:all: Pillow==12.1.1
      - name: Get short-lived Yandex IAM token
        id: yc_iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
      - name: Publish and verify both mirrors
        env:
          YC_IAM_TOKEN: ${{ steps.yc_iam.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEZFIT_APP_ORIGIN: ${{ vars.MEZFIT_APP_ORIGIN }}
        run: python tools/exercises/publish_base2_media.py
