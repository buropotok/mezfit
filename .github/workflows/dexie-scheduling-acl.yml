name: Apply Dexie Cloud scheduling ACL

# Explicit manual launch only. Role mutations never run on PR or push.
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: 'Preview exact Coach/Client scheduling ACL or apply it'
        required: true
        default: preview
        options: [preview, apply]
      confirmation:
        type: string
        description: 'For apply enter APPLY_SCHEDULING_COACH_CLIENT_ACL'
        required: false

permissions:
  contents: read

# Serialize all privileged Dexie Cloud CLI writes against existing schema/catalogue workflows.
concurrency:
  group: dexie-public-catalogue-publishing
  cancel-in-progress: false

jobs:
  scheduling-acl:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: dexie-production
    env:
      DEXIE_ACL_OPERATION: ${{ inputs.operation }}
      DEXIE_ACL_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manual dispatch and explicit confirmation
        run: node tools/dexie-roles/scheduling.mjs preflight
      - name: Prepare protected Dexie CLI credentials
        env:
          DEXIE_CLOUD_WRITE_KEY: ${{ secrets.DEXIE_CLOUD_WRITE_KEY }}
        run: node tools/dexie-schema/manage.mjs prepare
      - name: Export schema and roles before mutation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dexie-schema-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --schema before-schema.json
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --roles before-roles.json
      - name: Plan and report exact approved role delta
        id: plan
        run: node tools/dexie-roles/scheduling.mjs plan
      - name: Re-export live configuration immediately before apply
        if: inputs.operation == 'apply' && steps.plan.outputs.change_count != '0'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dexie-schema-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --schema current-schema.json
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --roles current-roles.json
          cd "$GITHUB_WORKSPACE"
          node tools/dexie-roles/scheduling.mjs recheck
      - name: Import only approved Coach and Client global roles
        if: inputs.operation == 'apply' && steps.plan.outputs.change_count != '0'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dexie-schema-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud import roles-only-import.json
      - name: Export schema and roles after apply
        if: inputs.operation == 'apply'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dexie-schema-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --schema after-schema.json
          npx --yes --package=dexie-cloud@3.0.7 -- dexie-cloud export --roles after-roles.json
      - name: Verify exact ACL and untouched cloud configuration
        if: inputs.operation == 'apply'
        run: node tools/dexie-roles/scheduling.mjs verify
      - name: Remove temporary credentials and private exports
        if: always()
        run: rm -rf "$RUNNER_TEMP/dexie-schema-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
