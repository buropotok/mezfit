name: Diagnose or smoke-test migration infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect an existing Workflow instance or run a new infrastructure or processor smoke
        type: choice
        options: [diagnose, smoke, processor-smoke, nested-smoke]
        default: diagnose
        required: true
      instance_id:
        description: Workflow instance UUID (required for diagnose)
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.operation == 'diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Workflow instance history
        run: node migration/cloudflare.mjs
        env:
          MIGRATION_OPERATION: diagnose
          MIGRATION_INSTANCE_ID: ${{ inputs.instance_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload sanitized migration trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-trace-${{ github.job }}-${{ github.run_attempt }}
          path: migration-trace.json
          if-no-files-found: warn
          retention-days: 7

  smoke:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && (inputs.operation == 'smoke' || inputs.operation == 'processor-smoke' || inputs.operation == 'nested-smoke')
    concurrency:
      group: mezfit-migration-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployed resources and run the integration smoke
        run: node migration/cloudflare.mjs
        env:
          MIGRATION_OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MEZFIT_APP_ORIGIN: ${{ vars.MEZFIT_APP_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_API_TOKEN }}
      - name: Upload sanitized migration trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-trace-${{ github.job }}-${{ github.run_attempt }}
          path: migration-trace.json
          if-no-files-found: warn
          retention-days: 7
