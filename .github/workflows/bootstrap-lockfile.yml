name: Bootstrap dependency lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Show resolved direct dependencies
        run: |
          node -e "const l=require('./package-lock.json'); console.log(JSON.stringify(l.packages[''], null, 2))"

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate package lock"
          git push
