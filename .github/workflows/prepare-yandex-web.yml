name: Prepare Yandex Web Hosting

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preview or owner-confirmed web foundation creation
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: read

concurrency:
  group: mezfit-yandex-web-foundation
  cancel-in-progress: false

jobs:
  web-foundation:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate operator configuration
        env:
          MODE: ${{ inputs.mode }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODE" == preview || "$MODE" == apply ]] || { echo "Invalid mode"; exit 1; }
          for key in YC_DEPLOY_SA_ID YC_FOLDER_ID; do
            [[ "${!key}" =~ ^[a-z0-9]+$ ]] || { echo "Missing or invalid $key"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Acquire short-lived Yandex IAM token using GitHub OIDC
        id: yc_iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}

      - name: Preview or create Yandex web foundation
        env:
          MODE: ${{ inputs.mode }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_IAM_TOKEN: ${{ steps.yc_iam.outputs.token }}
        run: python3 tools/yandex-infrastructure/web_hosting.py
