name: Deploy Mezfit credential replica

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview resources or apply the private credential replica
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: read

concurrency:
  group: mezfit-yandex-web-gateway
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deployment dependencies
        run: python3 -m pip install -r tools/yandex-infrastructure/requirements-account-replica-deploy.txt
      - name: Acquire short-lived Yandex IAM token
        id: yc_iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}
      - name: Preview or apply the private replica
        env:
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_IAM_TOKEN: ${{ steps.yc_iam.outputs.token }}
          CREDENTIAL_REPLICA_MODE: ${{ inputs.mode }}
          MEZFIT_CREDENTIAL_REPLICATION_SECRET: ${{ inputs.mode == 'apply' && secrets.MEZFIT_CREDENTIAL_REPLICATION_SECRET || '' }}
        run: python3 tools/yandex-infrastructure/deploy_credential_replica.py
