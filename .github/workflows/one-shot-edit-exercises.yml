name: One-shot exercise edit implementation
on:
  push:
    branches: [feat/edit-bundled-exercises]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edit-bundled-exercises
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/lib/exercises.ts')
          s=p.read_text()
          s=s.replace("can_edit:row.scope==='coach'&&row.owner_coach_user_id===coachUserId", "can_edit:row.scope==='global'||(row.scope==='coach'&&row.owner_coach_user_id===coachUserId)")
          def override_select(sql):
              sql=sql.replace("e.name,e.name_en,e.description,e.tracking_type,e.category_code,e.equipment_code", "COALESCE(o.name,e.name) AS name,e.name_en,COALESCE(o.description,e.description) AS description,COALESCE(o.tracking_type,e.tracking_type) AS tracking_type,COALESCE(o.category_code,e.category_code) AS category_code,COALESCE(o.equipment_code,e.equipment_code) AS equipment_code")
              sql=sql.replace("e.name,e.description,e.tracking_type,e.category_code,e.equipment_code", "COALESCE(o.name,e.name) AS name,COALESCE(o.description,e.description) AS description,COALESCE(o.tracking_type,e.tracking_type) AS tracking_type,COALESCE(o.category_code,e.category_code) AS category_code,COALESCE(o.equipment_code,e.equipment_code) AS equipment_code")
              sql=sql.replace("FROM exercise_definition e LEFT JOIN coach_exercise_favourite", "FROM exercise_definition e LEFT JOIN exercise_definition_override o ON o.exercise_definition_id=e.id AND o.coach_user_id=? LEFT JOIN coach_exercise_favourite")
              return sql
          # only read queries need overrides
          start=s.index('export async function listExercisesForClient')
          end=s.index('async function findOwnedExercise')
          block=override_select(s[start:end])
          block=block.replace('.bind(coachUserId,coachUserId,coachUserId,clientUserId)', '.bind(coachUserId,coachUserId,coachUserId,coachUserId,clientUserId)')
          block=block.replace('.bind(coachUserId,coachUserId,filters.categoryCode', '.bind(coachUserId,coachUserId,coachUserId,filters.categoryCode')
          block=block.replace('.bind(coachUserId,exerciseId,coachUserId)', '.bind(coachUserId,coachUserId,exerciseId,coachUserId)')
          s=s[:start]+block+s[end:]
          old="export async function updateExerciseForCoach(db:D1Database,coachUserId:number,exerciseId:number,input:Omit<CreateExerciseInput,'scope'>):Promise<'forbidden'|'exists'|ExerciseDefinitionRow>{const owned=await findOwnedExercise(db,coachUserId,exerciseId);if(!owned||!canCoachMutateExercise(owned.scope,owned.owner_coach_user_id,coachUserId))return'forbidden';if(await coachNameExists(db,coachUserId,input.name,exerciseId))return'exists';await db.prepare(`UPDATE exercise_definition SET name=?,description=?,tracking_type=?,category_code=?,equipment_code=?,updated_at=CURRENT_TIMESTAMP WHERE id=? AND scope='coach' AND owner_coach_user_id=? AND is_archived=0`).bind(input.name,input.description,input.trackingType,input.categoryCode,input.equipmentCode,exerciseId,coachUserId).run();const updated=await getExerciseForCoach(db,coachUserId,exerciseId);return updated??'forbidden'}"
          new="export async function updateExerciseForCoach(db:D1Database,coachUserId:number,exerciseId:number,input:Omit<CreateExerciseInput,'scope'>):Promise<'forbidden'|'exists'|ExerciseDefinitionRow>{const owned=await findOwnedExercise(db,coachUserId,exerciseId);if(!owned)return'forbidden';if(owned.scope==='global'){await db.prepare(`INSERT INTO exercise_definition_override(coach_user_id,exercise_definition_id,name,description,tracking_type,category_code,equipment_code) VALUES(?,?,?,?,?,?,?) ON CONFLICT(coach_user_id,exercise_definition_id) DO UPDATE SET name=excluded.name,description=excluded.description,tracking_type=excluded.tracking_type,category_code=excluded.category_code,equipment_code=excluded.equipment_code,updated_at=CURRENT_TIMESTAMP`).bind(coachUserId,exerciseId,input.name,input.description,input.trackingType,input.categoryCode,input.equipmentCode).run();const updated=await getExerciseForCoach(db,coachUserId,exerciseId);return updated??'forbidden'}if(!canCoachMutateExercise(owned.scope,owned.owner_coach_user_id,coachUserId))return'forbidden';if(await coachNameExists(db,coachUserId,input.name,exerciseId))return'exists';await db.prepare(`UPDATE exercise_definition SET name=?,description=?,tracking_type=?,category_code=?,equipment_code=?,updated_at=CURRENT_TIMESTAMP WHERE id=? AND scope='coach' AND owner_coach_user_id=? AND is_archived=0`).bind(input.name,input.description,input.trackingType,input.categoryCode,input.equipmentCode,exerciseId,coachUserId).run();const updated=await getExerciseForCoach(db,coachUserId,exerciseId);return updated??'forbidden'}"
          if old not in s: raise SystemExit('update function pattern not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/coach/GlobalExerciseCatalog.tsx'); s=p.read_text()
          s=s.replace("{exercise.can_edit ? <button className=\"exercise-square-button detail-icon\" type=\"button\" onClick={onEdit} disabled={busy} aria-label=\"Редактировать упражнение\"><ActionIcon icon=\"edit\" /></button> : null}", "<button className=\"exercise-square-button detail-icon\" type=\"button\" onClick={onEdit} disabled={busy} aria-label=\"Редактировать упражнение\"><ActionIcon icon=\"edit\" /></button>")
          s=s.replace("{exercise.can_edit ? <button type=\"button\" role=\"menuitem\" onClick={onEdit}><ActionIcon icon=\"edit\" /><span>Редактировать</span></button> : null}", "<button type=\"button\" role=\"menuitem\" onClick={onEdit}><ActionIcon icon=\"edit\" /><span>Редактировать</span></button>")
          s=s.replace("onDelete={editing.mode === 'edit' ? () => void deleteEdited() : undefined}", "onDelete={editing.mode === 'edit' && editing.seed?.scope === 'coach' ? () => void deleteEdited() : undefined}")
          p.write_text(s)

          Path('migrations/0020_exercise_definition_overrides.sql').write_text('''PRAGMA foreign_keys = ON;\n\nCREATE TABLE exercise_definition_override (\n  coach_user_id INTEGER NOT NULL REFERENCES user(id) ON DELETE CASCADE,\n  exercise_definition_id INTEGER NOT NULL REFERENCES exercise_definition(id) ON DELETE CASCADE,\n  name TEXT NOT NULL,\n  description TEXT,\n  tracking_type TEXT NOT NULL CHECK (tracking_type IN ('weight_reps','time','time_distance','time_reps','time_weight')),\n  category_code TEXT NOT NULL,\n  equipment_code TEXT NOT NULL,\n  created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (coach_user_id, exercise_definition_id)\n);\n''')

          # regression coverage for the contract without coupling to rendering internals
          t=Path('worker/lib/exercises.test.ts'); x=t.read_text()
          x=x.replace("import { archiveExerciseForCoach, canCoachMutateExercise, listExercisesForCoach } from './exercises';", "import { archiveExerciseForCoach, canCoachMutateExercise, listExercisesForCoach, updateExerciseForCoach } from './exercises';")
          insert="""\n it('stores coach-local overrides when editing a bundled global exercise',async()=>{const db=new FakeDb();db.firstRow={id:1,scope:'global',owner_coach_user_id:null};await updateExerciseForCoach(db as unknown as D1Database,7,1,{name:'Мой жим',description:'Техника',trackingType:'weight_reps',categoryCode:'chest',equipmentCode:'barbell'});expect(db.queries.some((query)=>query.sql.includes('INSERT INTO exercise_definition_override'))).toBe(true)});\n"""
          x=x.replace(" it('refuses to archive a bundled global definition'", insert+" it('refuses to archive a bundled global definition'")
          t.write_text(x)
          PY
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-edit-exercises.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(exercises): edit bundled exercises with coach overrides"
          git push origin HEAD:feat/edit-bundled-exercises
