name: Import Exercise Media to R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/import-gym-keeper-media.mjs
      - .github/workflows/import-exercise-media.yml

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Import matched exercise GIFs to R2
        run: node tools/import-gym-keeper-media.mjs
