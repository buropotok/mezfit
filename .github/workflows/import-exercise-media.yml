name: Import Exercise Media to R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/import-gym-keeper-media.mjs
      - tools/exercise-media-matcher.mjs
      - tools/exercise-media-matcher.test.mjs
      - worker/lib/exercise-media.ts
      - .github/workflows/import-exercise-media.yml

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test exercise media matcher
        run: npx vitest run tools/exercise-media-matcher.test.mjs
      - name: Import matched exercise GIFs through Worker R2 binding
        run: node tools/import-gym-keeper-media.mjs
