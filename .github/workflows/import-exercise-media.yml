name: Import Full Exercise Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/import-full-exercise-dataset.mjs
      - worker/lib/exercise-media.ts
      - migrations/0017_full_exercise_dataset.sql
      - .github/workflows/import-exercise-media.yml

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import all 1324 exercise records and GIFs
        run: node tools/import-full-exercise-dataset.mjs
