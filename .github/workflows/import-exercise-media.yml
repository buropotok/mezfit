name: Import Full Exercise Dataset

# This legacy D1/R2 media cutover must never run after a normal app deployment.
# It can change the active media version referenced by immutable Dexie rows.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type IMPORT_PINNED_1324 to reimport the reviewed immutable GIF dataset'
        type: string
        required: true

concurrency:
  group: mezfit-full-exercise-dataset-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.confirmation == 'IMPORT_PINNED_1324'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import, validate and atomically activate all 1324 exercises
        run: node tools/import-full-exercise-dataset.mjs
