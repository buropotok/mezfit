name: Apply reviewed Russian exercise instruction translations batch 04

on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths: [.github/workflows/one-time-howto-review-batch04.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'buropotok/mezfit'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - name: Apply exact curated translations; validate all original fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from collections import defaultdict

          tools=Path('tools/exercise-work')
          report_path=tools/'howto-translation-progress.json'
          previous=json.loads(report_path.read_text(encoding='utf-8'))
          assert (previous['total_work_json'],previous['nonempty_how_to'],previous['unique_nonempty_how_to'])==(1673,963,652)
          assert (previous['translated_work_json'],previous['translated_unique'])==(99,26)
          assert previous['remaining_work_json_with_nonempty_how_to']==864
          old_paths=set(previous['translated_paths'])
          assert len(old_paths)==99

          reference=json.loads((tools/'howto-high-reuse.json').read_text(encoding='utf-8'))
          reviewed=json.loads((tools/'howto-manual-reviewed-batch-04.json').read_text(encoding='utf-8'))
          ranks={18,19,20,24}
          assert {e['rank'] for e in reviewed['translations']}==ranks
          translations={}
          for item in reviewed['translations']:
              ref=reference[item['rank']-1]
              english=ref['how_to']
              russian=item['how_to_ru']
              assert len(english)>1000 and len(russian)>1000
              assert isinstance(russian,str) and re.search(r'[А-Яа-яЁё]',russian)
              assert english not in translations
              translations[english]=russian
              assert ref['uses']==3
          assert len(translations)==4

          source=Path('assets/exercises')
          work=Path('assets/work')
          paths=sorted(work.glob('*/*.json'))
          originals=sorted(p for p in source.glob('*/*.json') if p.name!='_manifest.json')
          assert len(paths)==len(originals)==1673
          assert {p.relative_to(work) for p in paths}=={p.relative_to(source) for p in originals}
          added=[]
          for p in paths:
              old=json.loads(p.read_text(encoding='utf-8'))
              original=json.loads((source/p.relative_to(work)).read_text(encoding='utf-8'))
              assert set(old)==set(original)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in old else set()),p
              assert all(type(old[k]) is type(v) and old[k]==v for k,v in original.items()),p
              if old.get('how_to') not in translations:
                  continue
              assert 'how_to_ru' not in old,p
              new={}
              for k,v in old.items():
                  new[k]=v
                  if k=='how_to':
                      new['how_to_ru']=translations[v]
              assert set(new)==set(old)|{'how_to_ru'}
              assert all(type(new[k]) is type(v) and new[k]==v for k,v in old.items()),p
              p.write_text(json.dumps(new,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              added.append(str(p))

          assert len(added)==12 and not old_paths.intersection(added)
          assert set(added)=={entry['path'] for r in ranks for entry in reference[r-1]['paths']},'Mismatched expected duplicate paths'
          all_en=0
          all_ru=0
          exact_pairs=defaultdict(set)
          for p in paths:
              record=json.loads(p.read_text(encoding='utf-8'))
              original=json.loads((source/p.relative_to(work)).read_text(encoding='utf-8'))
              assert set(record)==set(original)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in record else set()),p
              assert all(type(record[k]) is type(v) and record[k]==v for k,v in original.items()),p
              en=record.get('how_to','')
              if isinstance(en,str) and en.strip(): all_en+=1
              if 'how_to_ru' in record:
                  assert isinstance(en,str) and en.strip()
                  assert isinstance(record['how_to_ru'],str) and re.search(r'[А-Яа-яЁё]',record['how_to_ru'])
                  assert str(p) in old_paths|set(added)
                  exact_pairs[en].add(record['how_to_ru'])
                  all_ru+=1
              elif en in translations:
                  raise AssertionError(f'Missed translation: {p}')
          assert all_en==963 and all_ru==111
          assert len(exact_pairs)==30 and all(len(v)==1 for v in exact_pairs.values())
          updated=dict(previous)
          updated['translated_unique']=30
          updated['translated_work_json']=111
          updated['remaining_work_json_with_nonempty_how_to']=852
          updated['translated_paths']=sorted(old_paths|set(added))
          updated['human_reviewed_sources']=[
              'tools/exercise-work/howto-manual-reviewed.json',
              'tools/exercise-work/howto-manual-reviewed-batch-02.json',
              'tools/exercise-work/howto-manual-reviewed-batch-03.json',
              'tools/exercise-work/howto-manual-reviewed-batch-04.json'
          ]
          updated['fourth_batch_unique']=4
          updated['fourth_batch_json']=12
          updated['all_original_fields_identical']=True
          updated['no_source_files_changed']=True
          report_path.write_text(json.dumps(updated,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('REVIEW_RESULT='+json.dumps({k:v for k,v in updated.items() if k!='translated_paths'},ensure_ascii=False),flush=True)
          PY
          git diff --check
          git diff --exit-code -- assets/exercises/
      - name: Commit reviewed data changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work tools/exercise-work/howto-translation-progress.json
          git commit -m 'data: add fourth human-reviewed Russian exercise instruction batch'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
