name: Prepare Yandex Cloud DNS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preview or explicitly approved creation of mezfit.ru DNS zone
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply
      confirm:
        description: For Apply, type CREATE_MEZFIT_RU_DNS (otherwise leave empty)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mezfit-yandex-dns-foundation
  cancel-in-progress: false

jobs:
  dns:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate selected mode and existing Yandex OIDC configuration
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODE" == preview || "$MODE" == apply ]] || { echo "Invalid mode"; exit 1; }
          if [[ "$MODE" == apply ]]; then
            [[ "$CONFIRM" == CREATE_MEZFIT_RU_DNS ]] || { echo "Apply requires explicit confirmation"; exit 1; }
          fi
          for key in YC_DEPLOY_SA_ID YC_FOLDER_ID; do
            [[ "${!key}" =~ ^[a-z0-9]+$ ]] || { echo "Missing or invalid repository variable: $key"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get short-lived Yandex IAM token via existing GitHub OIDC federation
        id: yc_iam
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_DEPLOY_SA_ID }}

      - name: Preview or create public DNS zone
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_IAM_TOKEN: ${{ steps.yc_iam.outputs.token }}
        run: python3 tools/yandex-infrastructure/dns_zone.py
