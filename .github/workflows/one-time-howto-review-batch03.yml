name: Apply reviewed Russian exercise instruction translations batch 03

on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths: [.github/workflows/one-time-howto-review-batch03.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - name: Apply exact reviewed translations and verify 1673 source pairs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          tool_dir=Path('tools/exercise-work')
          progress_path=tool_dir/'howto-translation-progress.json'
          old=json.loads(progress_path.read_text(encoding='utf-8'))
          assert old['total_work_json']==1673
          assert old['nonempty_how_to']==963
          assert old['translated_work_json']==63
          assert old['translated_unique']==17
          assert old['remaining_work_json_with_nonempty_how_to']==900
          previously_done=set(old['translated_paths'])
          assert len(previously_done)==63

          reusable=json.loads((tool_dir/'howto-high-reuse.json').read_text(encoding='utf-8'))
          curated=json.loads((tool_dir/'howto-manual-reviewed-batch-03.json').read_text(encoding='utf-8'))
          rank_set={1,4,5,14,15,16,17,22,30}
          assert {entry['rank'] for entry in curated['translations']}==rank_set

          exact={}
          by_rank={}
          for entry in curated['translations']:
              index=entry['rank']-1
              english=reusable[index]['how_to']
              russian=entry['how_to_ru']
              assert isinstance(english,str) and english.strip()
              assert isinstance(russian,str) and russian.strip() and re.search('[А-Яа-яЁё]',russian)
              assert english not in exact
              exact[english]=russian
              by_rank[entry['rank']]=(english,russian)
          assert len(exact)==9
          assert sum(reusable[i-1]['uses'] for i in rank_set)==36

          work_files=sorted(Path('assets/work').glob('*/*.json'))
          source_files=sorted(p for p in Path('assets/exercises').glob('*/*.json') if p.name!='_manifest.json')
          assert len(work_files)==len(source_files)==1673
          assert {p.relative_to('assets/work') for p in work_files}=={p.relative_to('assets/exercises') for p in source_files}
          modified=[]
          for path in work_files:
              w=json.loads(path.read_text(encoding='utf-8'))
              s=json.loads((Path('assets/exercises')/path.relative_to('assets/work')).read_text(encoding='utf-8'))
              assert all(k in w and type(w[k]) is type(v) and w[k]==v for k,v in s.items()),str(path)
              assert set(w)==set(s)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in w else set()),str(path)
              if w.get('how_to') not in exact:
                  continue
              assert 'how_to_ru' not in w,str(path)
              rewritten={}
              for k,v in w.items():
                  rewritten[k]=v
                  if k=='how_to':
                      rewritten['how_to_ru']=exact[v]
              assert len(rewritten)==len(w)+1
              assert all(rewritten[k]==v and type(rewritten[k]) is type(v) for k,v in w.items())
              path.write_text(json.dumps(rewritten,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              modified.append(str(path))
          assert len(modified)==36 and not previously_done.intersection(modified)

          translated=0
          original_translated=0
          nonempty_english=0
          for path in work_files:
              w=json.loads(path.read_text(encoding='utf-8'))
              s=json.loads((Path('assets/exercises')/path.relative_to('assets/work')).read_text(encoding='utf-8'))
              assert all(k in w and type(w[k]) is type(v) and w[k]==v for k,v in s.items()),str(path)
              assert set(w)==set(s)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in w else set()),str(path)
              has_english=isinstance(w.get('how_to'),str) and bool(w['how_to'].strip())
              nonempty_english+=int(has_english)
              if 'how_to_ru' in w:
                  assert has_english and re.search(r'[А-Яа-яЁё]',w['how_to_ru'])
                  assert str(path) in previously_done|set(modified)
                  if str(path) in previously_done: original_translated+=1
                  if w['how_to'] in exact:
                      assert w['how_to_ru']==exact[w['how_to']]
                  translated+=1
              else:
                  assert w.get('how_to') not in exact
          assert nonempty_english==963 and original_translated==63 and translated==99

          report=dict(old)
          report['translated_unique']=26
          report['translated_work_json']=99
          report['remaining_work_json_with_nonempty_how_to']=864
          report['translated_paths']=sorted(previously_done|set(modified))
          report['human_reviewed_sources']=[
              'tools/exercise-work/howto-manual-reviewed.json',
              'tools/exercise-work/howto-manual-reviewed-batch-02.json',
              'tools/exercise-work/howto-manual-reviewed-batch-03.json'
          ]
          report['third_batch_unique']=9
          report['third_batch_json']=36
          report['third_batch_source_title_only']=5
          report['all_original_fields_identical']=True
          report['no_source_files_changed']=True
          progress_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('RESULT',json.dumps({k:v for k,v in report.items() if k!='translated_paths'},ensure_ascii=False),flush=True)
          PY
          git diff --check
          git diff --exit-code -- assets/exercises/
      - name: Commit only verified instruction additions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work tools/exercise-work/howto-translation-progress.json
          git commit -m 'data: add third human-reviewed Russian exercise instructions batch'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
