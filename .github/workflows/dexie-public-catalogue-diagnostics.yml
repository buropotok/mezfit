name: Diagnose Dexie public catalogue

# Runs on the default branch only. The issue-comment route allows the connected
# GitHub operator to request diagnostics without a workflow_dispatch API tool.
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: dexie-public-catalogue-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/dexie-public diagnose')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Job-level env expressions cannot access the runner context.
      OUT_DIR: .dexie-public-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query public catalogue via read-only REST API
        env:
          DEXIE_CLOUD_KEY_JSON: ${{ secrets.DEXIE_CLOUD_KEY_JSON }}
        run: |
          node tools/exercises/diagnose-public-catalogue-rest.mjs "$OUT_DIR/report.md"
          cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
      # mezfit is public: upload only an aggregate read-only report; never raw records.
      - name: Upload safe summary only
        uses: actions/upload-artifact@v4
        with:
          name: dexie-public-catalogue-diagnostics
          path: ${{ env.OUT_DIR }}/report.md
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary diagnostic report
        if: always()
        run: rm -rf "$OUT_DIR"
