name: Build curated Russian exercise catalogue (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-reconcile-exercise-work.yml
      - tools/exercise-work/build-reviewed.py

permissions:
  contents: read

jobs:
  generate:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'data: prepare curated exercise catalogue build'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        category: [abs, back, biceps, calf, cardio, erector-spinae, forearm, full-body, hip, leg, shoulders, trapezius, triceps]
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate every exercise and emit one category
        run: python tools/exercise-work/build-reviewed.py --category "${{ matrix.category }}"
      - name: Assert source catalogue unchanged
        run: git diff --exit-code -- assets/exercises
