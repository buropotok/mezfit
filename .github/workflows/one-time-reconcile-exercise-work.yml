name: One-time reconcile reviewed exercise JSON

on:
  push:
    branches: [main]
    paths:
      - tools/exercise-work/reconcile-reviewed-existing.py
      - .github/workflows/one-time-reconcile-exercise-work.yml

permissions:
  contents: write

concurrency:
  group: exercise-work-catalogue-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'buropotok/mezfit' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'data: prepare one-time exercise work reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile only existing reviewed copies
        run: python tools/exercise-work/reconcile-reviewed-existing.py
      - name: Ensure original exercise files were not touched
        run: git diff --exit-code -- assets/exercises
      - name: Commit corrected work copies to main once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/work
          if git diff --cached --quiet; then
            echo 'All existing copies already match current source'
            exit 0
          fi
          git commit -m 'data: reconcile reviewed exercise copies with current source'
          git push origin HEAD:refs/heads/main
