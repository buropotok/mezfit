name: Import 112 Gym Keeper GIFs to private R2

# Deliberate, data-only operation. Never upload on PR, merge, push or deploy.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Preview the strict import plan or upload to isolated R2 prefix'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - upload

permissions:
  contents: read

concurrency:
  group: mezfit-gym-keeper-unmatched-112-r2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require manual launch from main by repository owner
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "buropotok/mezfit"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
      - name: Preview and validate all 112 exercise GIF identities
        run: node tools/exercises/import-gym-keeper-unmatched-r2.mjs preview
      - name: Upload 112 exact APK GIFs to isolated private R2 prefix
        if: ${{ inputs.operation == 'upload' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          node tools/exercises/import-gym-keeper-unmatched-r2.mjs upload
