name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Yandex infrastructure operator contracts
        run: python3 -m unittest discover -s tools/yandex-infrastructure -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Limit competing Vitest workers on shared CI runners without changing test timeouts or assertions.
      - run: npm test -- --maxWorkers=4
      - run: npm run typecheck
      - run: npm run build
