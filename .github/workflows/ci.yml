name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Export upstream exercise names
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/hasaneyldrm/exercises-dataset.git /tmp/exercises-dataset
          git -C /tmp/exercises-dataset sparse-checkout set data
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('/tmp/exercises-dataset/data/exercises.json','utf8')); fs.writeFileSync('exercise-names-en.json', JSON.stringify(Object.fromEntries(rows.map(x=>[x.id,x.name])), null, 2)+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: exercise-names-en
          path: exercise-names-en.json
