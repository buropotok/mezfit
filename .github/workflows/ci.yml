name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Yandex infrastructure operator contracts
        run: python3 -m unittest discover -s tools/yandex-infrastructure -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Telegram OIDC Yandex Function contracts
        run: node --test tools/yandex-infrastructure/browser-auth/*.node-contract.cjs
      - name: Verify Telegram JWKS mirror Worker contracts
        run: node --test tools/jwks-mirror/*.node-contract.mjs
      - run: npm ci
      # Limit competing Vitest workers on shared CI runners without changing test timeouts or assertions.
      - run: npm test -- --maxWorkers=4
      - run: npm run typecheck
      - run: npm run build

  account-replica-ydb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the replica SDK
        run: python3 -m pip install -r tools/yandex-infrastructure/requirements-account-replica-deploy.txt
      - name: Start disposable YDB
        run: |
          docker run --detach --name replica-ydb --hostname localhost \
            --publish 127.0.0.1:2136:2136 \
            --env GRPC_PORT=2136 ydbplatform/local-ydb:26.3.1.28@sha256:780be13e9f1f075f1726e12307ca1a847ac86219a9a22d945ce3e13f1a4b0007
      - name: Verify replica schema and concurrent transactions against YDB
        run: python3 tools/yandex-infrastructure/integration_account_replica.py
      - name: Verify full account snapshots and revocation against YDB
        run: python3 tools/yandex-infrastructure/integration_account_replica_full_snapshot.py
