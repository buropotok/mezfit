name: Download FitnessProgramer GIF media

on:
  push:
    branches: [main]
    paths:
      - tools/download_fitnessprogramer_gifs.py
      - .github/workflows/download-fitnessprogramer-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-fitnessprogramer-gifs
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'buropotok/mezfit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - run: python tools/download_fitnessprogramer_gifs.py preflight

  images:
    needs: preflight
    if: github.repository == 'buropotok/mezfit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        category:
          - neck
          - trapezius
          - shoulders
          - chest
          - back
          - erector-spinae
          - biceps
          - triceps
          - forearm
          - abs
          - leg
          - calf
          - hip
          - cardio
          - full-body
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Download verified GIFs and annotate category JSON
        env:
          CATEGORY: ${{ matrix.category }}
        run: python tools/download_fitnessprogramer_gifs.py "$CATEGORY" --workers 4
      - name: Commit GIF media and category metadata
        env:
          CATEGORY: ${{ matrix.category }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/ "assets/exercises/${CATEGORY}/"
          if ! git diff --cached --quiet; then
            git commit -m "data: add ${CATEGORY} GIF media and image_id"
            git push origin "HEAD:refs/heads/data/fitnessprogramer-gifs-20261027-${CATEGORY}"
          fi
