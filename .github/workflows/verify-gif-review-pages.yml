name: Verify GIF review Pages candidates

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-gif-review-pages.yml"
      - ".github/workflows/verify-gif-review-pages.yml"
      - "tools/gif-review-pages/**"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed source report
        uses: actions/download-artifact@v4
        with:
          name: gif-visual-delta-report
          run-id: 41322174596
          github-token: ${{ github.token }}
          path: audit-artifact
      - name: Check generator contracts
        run: python3 -m unittest discover -s tools/gif-review-pages -p 'test_*.py'
      - name: Generate candidates from real sources
        run: |
          python3 tools/gif-review-pages/build_data.py \
            --audit-dir audit-artifact \
            --out gif-review-preview \
            --github-ref "$GITHUB_SHA"
      - name: Check generated review inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("gif-review-preview/candidates.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert len(d["candidate_revision"]) == 64
          assert len(d["r2_index"]) == 1324
          assert d["github_count"] == 1168
          assert d["r2_count"] == 1324
          assert len(d["items"]) == 1168
          assert all(len(x["candidates"]) == 30 for x in d["items"])
          assert all(len({c["id"] for c in x["candidates"]}) == 30 for x in d["items"])
          # The 419 frozen visual matches are always the first visible card.
          import csv
          with Path("audit-artifact/matches.csv").open(newline="", encoding="utf-8-sig") as source:
              visual = {row["github_gif"]: row["r2_gif"].removesuffix(".gif")
                        for row in csv.DictReader(source)}
          assert len(visual) == 419
          queue = [item for item in d["items"] if "visual_candidates" in item]
          assert d["visual_queue_count"] == len(queue) == 419
          assert {item["gif"] for item in queue} == set(visual)
          for item in queue:
              candidates = item["visual_candidates"]
              assert 1 <= len(candidates) <= 5, item["gif"]
              assert candidates[0]["id"] == visual[item["gif"]], item["gif"]
              assert candidates[0]["source"] == "visual_audit", item["gif"]
              assert all(c["source"] == "semantic" for c in candidates[1:])
              assert len({c["id"] for c in candidates}) == len(candidates)
              assert all(1 <= c["rank"] <= 5 for c in candidates)
          # The remaining 749 use the pinned independent visual report, not the
          # legacy semantic-first ranking (which is still retained for later rounds).
          from collections import Counter
          remaining = [item for item in d["items"] if "remaining_candidates" in item]
          assert d["remaining_queue_count"] == len(remaining) == 749
          assert {item["gif"] for item in queue}.isdisjoint(
              {item["gif"] for item in remaining}
          )
          tiers = Counter(item["remaining_priority"]["tier"] for item in remaining)
          assert tiers == {0: 530, 1: 213, 2: 6}, tiers
          assert all(0 <= len(item["remaining_candidates"]) <= 5 for item in remaining)
          assert all(len({c["id"] for c in item["remaining_candidates"]}) ==
                     len(item["remaining_candidates"]) for item in remaining)
          with Path("audit-artifact/review.csv").open(newline="", encoding="utf-8-sig") as source:
              reviews = {}
              for row in csv.DictReader(source):
                  gif = row["github_gif"]
                  if gif in visual:
                      continue
                  candidate = (float(row["score"]), row["r2_gif"].removesuffix(".gif"))
                  old = reviews.get(gif)
                  if old is None or (-candidate[0], candidate[1]) < (-old[0], old[1]):
                      reviews[gif] = candidate
          with Path("audit-artifact/pose-candidates.csv").open(newline="", encoding="utf-8-sig") as source:
              poses = {}
              for row in csv.DictReader(source):
                  gif = row["github_gif"]
                  if gif in visual or gif in reviews or not row["pose_score"]:
                      continue
                  candidate = (float(row["pose_score"]), row["r2_gif"].removesuffix(".gif"))
                  old = poses.get(gif)
                  if old is None or (-candidate[0], candidate[1]) < (-old[0], old[1]):
                      poses[gif] = candidate
          for item in remaining:
              candidates = item["remaining_candidates"]
              priority = item["remaining_priority"]
              gif = item["gif"]
              if gif in reviews:
                  score, ident = reviews[gif]
                  assert priority["tier"] == 0
                  assert candidates[0]["source"] == "visual_review"
                  assert candidates[0]["id"] == ident
                  assert abs(priority["score"] - score) < 0.00001
              elif gif in poses:
                  score, ident = poses[gif]
                  assert priority["tier"] == 1
                  assert candidates[0]["source"] == "pose_position"
                  assert candidates[0]["id"] == ident
                  assert abs(priority["score"] - score) < 0.00001
              else:
                  assert priority == {"tier": 2, "score": None, "channel": "none"}
                  assert not candidates or candidates[0]["source"] == "semantic"
              assert all(c["source"] == "semantic" for c in candidates[1:])
          # Sort keys used by the UI: score desc inside each distinct evidence tier.
          ordered = sorted(remaining, key=lambda item: (
              item["remaining_priority"]["tier"],
              -(item["remaining_priority"]["score"] or 0),
              item["gif"]
          ))
          assert len(ordered) == 749
          print("Remaining queue tiers:", dict(tiers))
          assert Path("gif-review-preview/evidence.csv").stat().st_size > 1000
          PY
