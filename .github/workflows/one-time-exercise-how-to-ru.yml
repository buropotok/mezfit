name: Extract most-repeated exercise instructions for curated translation
on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths:
      - .github/workflows/one-time-exercise-how-to-ru.yml
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - name: Rank exact instruction duplicates
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          d=defaultdict(list)
          for path in Path("assets/work").glob("*/*.json"):
              j=json.loads(path.read_text())
              if j.get('how_to') and j['how_to'].strip():
                  d[j['how_to']].append({'path':str(path),'name_ru':j.get('name_ru')})
          ranked=sorted(d.items(),key=lambda kv:(-len(kv[1]),-len(kv[0])))
          report=[{'uses':len(paths),'length':len(text),'how_to':text,'paths':paths} for text,paths in ranked[:30]]
          p=Path('tools/exercise-work/howto-high-reuse.json')
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('TOP_REUSE',[(r['uses'],r['length']) for r in report])
          PY
      - name: Persist reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/exercise-work/howto-high-reuse.json
          git commit -m 'chore: identify duplicated instruction texts for manual translation'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
