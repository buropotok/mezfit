name: Apply human-reviewed Russian exercise how-to translations
on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths: [.github/workflows/one-time-exercise-how-to-ru.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - name: Apply reviewed translations only to matching source instructions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          root=Path('.')
          manifest=json.loads(Path('tools/exercise-work/howto-high-reuse.json').read_text(encoding='utf-8'))
          reviewed=json.loads(Path('tools/exercise-work/howto-manual-reviewed.json').read_text(encoding='utf-8'))
          translations={}
          for entry in reviewed['translations']:
              idx=entry['rank']-1
              assert 0<=idx<len(manifest),idx
              source=manifest[idx]['how_to']
              ru=entry['how_to_ru']
              assert source and ru.strip() and re.search('[А-Яа-яЁё]',ru)
              assert source not in translations
              translations[source]=ru
          assert len(translations)==len(reviewed['translations'])==10
          files=sorted(Path('assets/work').glob('*/*.json'))
          expected=sorted(p for p in Path('assets/exercises').glob('*/*.json') if p.name!='_manifest.json')
          assert len(files)==len(expected)==1673
          assert {p.relative_to('assets/work') for p in files}=={p.relative_to('assets/exercises') for p in expected}
          modified=[]
          translated_used=Counter()
          nonempty=0
          for p in files:
              j=json.loads(p.read_text(encoding='utf-8'))
              how_to=j.get('how_to','')
              orig=json.loads((Path('assets/exercises')/p.relative_to('assets/work')).read_text(encoding='utf-8'))
              assert set(j)==set(orig)|{'name_ru','tracking_type'},p
              assert all(j[k]==v and type(j[k])==type(v) for k,v in orig.items()),p
              if isinstance(how_to,str) and how_to.strip():
                  nonempty+=1
              ru=translations.get(how_to)
              if ru is None:
                  continue
              enriched={}
              for key,value in j.items():
                  enriched[key]=value
                  if key=='how_to':
                      enriched['how_to_ru']=ru
              assert len(enriched)==len(j)+1
              assert all(enriched[k]==v for k,v in j.items())
              p.write_text(json.dumps(enriched,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              modified.append(str(p))
              translated_used[how_to]+=1
          assert nonempty==963
          assert len(modified)==sum(manifest[next(i for i,x in enumerate(manifest) if x['how_to']==text)]['uses'] for text in translations)
          assert all(translated_used[s]>0 for s in translations)
          # Independently validate all work records against the immutable source records.
          filled=0
          for p in files:
              w=json.loads(p.read_text(encoding='utf-8'))
              o=json.loads((Path('assets/exercises')/p.relative_to('assets/work')).read_text(encoding='utf-8'))
              has_translation=w['how_to'] in translations
              assert ('how_to_ru' in w)==has_translation,p
              assert set(w)==set(o)|{'name_ru','tracking_type'}|({'how_to_ru'} if has_translation else set()),p
              assert all(w[k]==v and type(w[k])==type(v) for k,v in o.items()),p
              if has_translation:
                  assert w['how_to_ru']==translations[w['how_to']],p
                  filled+=1
          assert filled==len(modified)
          report={'total_work_json':1673,'nonempty_how_to':963,'unique_nonempty_how_to':652,'translated_unique':len(translations),'translated_work_json':filled,'remaining_work_json_with_nonempty_how_to':963-filled,'no_source_files_changed':True,'all_original_fields_identical':True,'human_reviewed_source':'tools/exercise-work/howto-manual-reviewed.json','machine_translation_not_used_due_to_terminology_errors':True,'translated_paths':modified}
          out=Path('tools/exercise-work/howto-translation-progress.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('REVIEWED_RESULT',json.dumps({k:v for k,v in report.items() if k!='translated_paths'},ensure_ascii=False),flush=True)
          PY
          git diff --check
          git diff --exit-code -- assets/exercises/
      - name: Publish reviewed translations to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work tools/exercise-work/howto-translation-progress.json
          git commit -m 'data: add human-reviewed Russian how-to instructions to reused exercises'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
