name: Pilot offline exercise instruction translation

on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths:
      - .github/workflows/one-time-exercise-how-to-ru.yml

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local EN-RU translation engine
        run: |
          python -m pip install --disable-pip-version-check 'argostranslate==1.10.0'
      - name: Download offline model and translate samples
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from argostranslate import package, translate
          started=time.monotonic()
          print("INDEX_START",flush=True)
          package.update_package_index()
          packages=package.get_available_packages()
          model=next(x for x in packages if x.from_code=='en' and x.to_code=='ru')
          print("MODEL",model,flush=True)
          package.install_from_path(model.download())
          print("MODEL_READY_SECONDS",round(time.monotonic()-started,1),flush=True)
          texts=[
            'Lie flat on your back with your knees bent and feet flat on the ground. Engage your abs, then lift your shoulders and upper back off the floor.',
            "Here's how you can perform the 4-point tummy vacuum exercise:\n1. Start on your hands and knees.\n2. Maintain a neutral spine.\n3. Inhale deeply through your nose.\n4. Exhale and pull your belly button toward your spine.",
            'The Thigh Fly as a static stretch:\n1. Starting Position: Lie on your back with your legs together, lifted towards the ceiling.\n2. Stretching Movement: Slowly open your legs to the sides as far as comfortable. Hold for 10-15 seconds.',
            '1. Place a weight plate flat on a smooth floor.\n2. Get into a low athletic stance: hips back, chest down, hands on the edge of the plate, arms extended.\n3. Engage your core, and drive through the balls of your feet to push the plate forward.'
          ]
          entries=[]
          for t in texts:
            t0=time.monotonic()
            ru=translate.translate(t,'en','ru')
            entries.append({'en':t,'ru':ru,'seconds':round(time.monotonic()-t0,2)})
          report={'model':'Argos EN-RU offline','initialization_seconds':round(time.monotonic()-started,2),'samples':entries}
          out=Path('tools/exercise-work/howto-translation-pilot.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print("PILOT_REPORT="+json.dumps(report,ensure_ascii=False)[:18000],flush=True)
          PY
      - name: Commit pilot result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/exercise-work/howto-translation-pilot.json
          git commit -m 'chore: evaluate offline EN-RU exercise translation'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
