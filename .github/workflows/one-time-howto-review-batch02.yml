name: Apply reviewed Russian how-to batch 02

on:
  push:
    branches: [data/exercise-how-to-ru-20261028]
    paths: [.github/workflows/one-time-howto-review-batch02.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/exercise-how-to-ru-20261028
      - name: Apply precise manually translated texts and check original catalogue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          import re

          tools=Path('tools/exercise-work')
          original_work_report=json.loads((tools/'howto-translation-progress.json').read_text())
          assert original_work_report['total_work_json']==1673
          assert original_work_report['translated_work_json']==42
          assert original_work_report['translated_unique']==10
          refs=json.loads((tools/'howto-high-reuse.json').read_text())
          batch=json.loads((tools/'howto-manual-reviewed-batch-02.json').read_text())
          assert len(batch['translations'])==7

          exact={}
          for record in batch['translations']:
              rank=record['rank']
              assert 1<=rank<=len(refs)
              src=refs[rank-1]['how_to']
              ru=record['how_to_ru']
              assert src.strip() and ru.strip() and re.search(r'[А-Яа-яЁё]',ru)
              assert src not in exact
              exact[src]=ru

          work_paths=sorted(Path('assets/work').glob('*/*.json'))
          src_paths=sorted(p for p in Path('assets/exercises').glob('*/*.json') if p.name!='_manifest.json')
          assert len(work_paths)==len(src_paths)==1673
          assert {p.relative_to('assets/work') for p in work_paths}=={p.relative_to('assets/exercises') for p in src_paths}
          prev=set(original_work_report['translated_paths'])
          assert len(prev)==42
          modified=[]
          other_existing=0
          for p in work_paths:
              j=json.loads(p.read_text(encoding='utf-8'))
              s=json.loads((Path('assets/exercises')/p.relative_to('assets/work')).read_text(encoding='utf-8'))
              assert set(j)==set(s)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in j else set()),str(p)
              assert all(j[k]==v and type(j[k])==type(v) for k,v in s.items()),str(p)
              if 'how_to_ru' in j:
                  assert str(p) in prev
                  other_existing+=1
              if j.get('how_to') not in exact:
                  continue
              assert 'how_to_ru' not in j,str(p)
              rebuilt={}
              for k,v in j.items():
                  rebuilt[k]=v
                  if k=='how_to':
                      rebuilt['how_to_ru']=exact[j[k]]
              assert len(rebuilt)==len(j)+1
              assert all(rebuilt[k]==v for k,v in j.items())
              p.write_text(json.dumps(rebuilt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              modified.append(str(p))

          assert other_existing==42
          assert len(modified)==sum(refs[r['rank']-1]['uses'] for r in batch['translations'])==21
          assert len(set(modified))==len(modified)
          assert not (set(modified)&prev)
          all_english=0
          all_ru=0
          for p in work_paths:
              j=json.loads(p.read_text(encoding='utf-8'))
              s=json.loads((Path('assets/exercises')/p.relative_to('assets/work')).read_text(encoding='utf-8'))
              assert all(j[k]==v and type(j[k])==type(v) for k,v in s.items()),str(p)
              assert set(j)==set(s)|{'name_ru','tracking_type'}|({'how_to_ru'} if 'how_to_ru' in j else set()),str(p)
              en=j.get('how_to')
              has_en=isinstance(en,str) and bool(en.strip())
              all_english+=int(has_en)
              has_ru='how_to_ru' in j
              if has_ru:
                  assert has_en and isinstance(j['how_to_ru'],str) and re.search(r'[А-Яа-яЁё]',j['how_to_ru'])
                  assert str(p) in prev|set(modified)
                  if en in exact:
                      assert j['how_to_ru']==exact[en]
                  all_ru+=1
          assert all_english==963
          assert all_ru==63
          report=dict(original_work_report)
          report['translated_unique']=17
          report['translated_work_json']=63
          report['remaining_work_json_with_nonempty_how_to']=900
          report['translated_paths']=sorted(prev|set(modified))
          report['human_reviewed_sources']=['tools/exercise-work/howto-manual-reviewed.json','tools/exercise-work/howto-manual-reviewed-batch-02.json']
          report['all_original_fields_identical']=True
          report['no_source_files_changed']=True
          (tools/'howto-translation-progress.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('RESULT',json.dumps({k:v for k,v in report.items() if k!='translated_paths'},ensure_ascii=False),flush=True)
          PY
          git diff --check
          git diff --exit-code -- assets/exercises/
      - name: Publish only verified translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work tools/exercise-work/howto-translation-progress.json
          git commit -m 'data: add second human-reviewed Russian exercise instructions batch'
          git push origin HEAD:refs/heads/data/exercise-how-to-ru-20261028
